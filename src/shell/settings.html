<!doctype html>
<meta charset="utf-8" />
<title>Réglages</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="dialog.css" />
<style>
  fieldset { margin: 0 0 14px; padding: 0; border: 0; }
  legend { padding: 0; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span {
    display: block; padding: 12px 8px; text-align: center; cursor: pointer;
    background: var(--field); border: 1px solid var(--border); border-radius: 10px;
    font-size: 12.5px; line-height: 1.3;
  }
  .choice span::before { content: attr(data-glyph); display: block; font-size: 19px; margin-bottom: 5px; }
  .choice input:checked + span { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="card">
  <h1>Réglages</h1>
  <p class="lead">Le thème s'applique à la fenêtre et aux boards.</p>

  <fieldset>
    <legend>Apparence</legend>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="theme" value="light" />
        <span data-glyph="☀">Clair</span>
      </label>
      <label class="choice">
        <input type="radio" name="theme" value="dark" />
        <span data-glyph="☾">Sombre</span>
      </label>
      <label class="choice">
        <input type="radio" name="theme" value="system" />
        <span data-glyph="◐">Système</span>
      </label>
    </div>
  </fieldset>

  <p class="hint">
    GitHub ne suit ce réglage que si le thème de ton compte est sur
    <code>Sync with system</code> (Settings → Appearance). Sinon, GitHub garde le sien
    et seul l'habillage de la fenêtre change.
  </p>

  <div class="row">
    <button type="button" id="close">Fermer</button>
  </div>
</div>

<script>
  const radios = [...document.querySelectorAll('input[name="theme"]')];

  kiosk.getTheme().then((theme) => {
    const match = radios.find((radio) => radio.value === theme) ?? radios.at(-1);
    match.checked = true;
  });

  for (const radio of radios) {
    radio.addEventListener("change", () => kiosk.setTheme(radio.value));
  }

  document.getElementById("close").addEventListener("click", () => kiosk.closeModal());
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") kiosk.closeModal();
  });
</script>
